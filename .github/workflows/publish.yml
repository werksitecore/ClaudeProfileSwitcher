name: Publish Marketplace preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require a configured publisher
        run: node -e "if (require('./package.json').publisher === 'local-prototype') throw new Error('Confirm the Marketplace publisher ID before publishing')"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-vsix
          path: downloads/claude-profile-switcher.vsix
      - name: Publish preview using trusted identity
        run: npx vsce publish --oidc --packagePath downloads/claude-profile-switcher.vsix
